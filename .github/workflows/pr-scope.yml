name: Check pull request scope

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]

  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-scope-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scope:
    name: PR scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Only the trusted base supplies executable code. Head is fetched as data.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check size and declared paths
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch origin "pull/$PR_NUMBER/head"
          test "$(git rev-parse FETCH_HEAD)" = "$HEAD_SHA"
          python3 scripts/check_pr_scope.py --base "$BASE_SHA" --head "$HEAD_SHA" \
            --event-file "$GITHUB_EVENT_PATH" --repo "$REPOSITORY"
