name: Check pull request scope

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  # See the job's if: the queue reuses the result from the pull request.
  merge_group:
# No pull_request_review trigger: that event runs the workflow file from the
# PR's own merge ref, so a PR could replace this job. After a Size-exception
# review, re-run this job; the re-run uses the base workflow and reads reviews live.

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-scope-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: PR scope
    # A pull request enters the merge queue only after this passed on its head.
    # On the queued commit the job is skipped, which GitHub counts as passing.
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Only the trusted base supplies executable code. Head is fetched as data.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check size and declared paths
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch origin "pull/$PR_NUMBER/head"
          test "$(git rev-parse FETCH_HEAD)" = "$HEAD_SHA"
          python3 scripts/check_pr_scope.py --base "$BASE_SHA" --head "$HEAD_SHA" \
            --event-file "$GITHUB_EVENT_PATH" --repo "$REPOSITORY"
          python3 scripts/check_context_budget.py --head "$HEAD_SHA"
