name: Build stable signed Dev

on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: Optional full reviewed commit SHA already reachable from main
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: msgblast-stable-dev
  cancel-in-progress: false

jobs:
  development:
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      MSGBLAST_APPLE_TEAM_ID: ${{ vars.MSGBLAST_APPLE_TEAM_ID }}
      MSGBLAST_DEVELOPER_ID_IDENTITY: ${{ vars.MSGBLAST_DEVELOPER_ID_IDENTITY }}
      MSGBLAST_NOTARY_KEY_ID: ${{ vars.MSGBLAST_NOTARY_KEY_ID }}
      MSGBLAST_NOTARY_ISSUER_ID: ${{ vars.MSGBLAST_NOTARY_ISSUER_ID }}
    steps:
      - name: Require reviewed default-branch source
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: test "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH"

      - name: Check out reviewed source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve only reviewed source
        env:
          REQUESTED_REVISION: ${{ inputs.source_revision }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess
          revision = os.environ['REQUESTED_REVISION'] or os.environ['GITHUB_SHA']
          if not re.fullmatch(r'[0-9a-f]{40}', revision):
              raise SystemExit('Source must be a full commit SHA')
          subprocess.run(['git', 'merge-base', '--is-ancestor', revision, os.environ['GITHUB_SHA']], check=True)
          subprocess.run(['git', 'checkout', '--detach', revision], check=True)
          with open(os.environ['GITHUB_ENV'], 'a') as file:
              file.write('REVIEW_SHA=' + revision + '\n')
          PY

      - name: Install temporary signing credentials
        env:
          MSGBLAST_DEVELOPER_ID_P12: ${{ secrets.MSGBLAST_DEVELOPER_ID_P12 }}
          MSGBLAST_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MSGBLAST_DEVELOPER_ID_P12_PASSWORD }}
          MSGBLAST_NOTARY_API_KEY: ${{ secrets.MSGBLAST_NOTARY_API_KEY }}
        run: python3 scripts/ci_signing.py setup

      - name: Build isolated signed and notarized Dev
        run: |
          python3 scripts/build_preview_apps.py \
            --sha "$REVIEW_SHA" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --output build/stable-dev --variant development \
            --signing-identity "$MSGBLAST_DEVELOPER_ID_IDENTITY" \
            --team-id "$MSGBLAST_APPLE_TEAM_ID" \
            --keychain "$MSGBLAST_NOTARY_KEYCHAIN" \
            --notary-profile "$MSGBLAST_NOTARY_PROFILE" \
            --build-stamp none

      - name: Upload signed Dev without credentials
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: msgblast-stable-dev-${{ env.REVIEW_SHA }}
          path: |
            build/stable-dev/*.zip
            build/stable-dev/preview-manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary credentials
        if: always()
        run: python3 scripts/ci_signing.py cleanup
